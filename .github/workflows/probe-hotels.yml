name: Probe Google Hotels (temporary)

on:
  push:
    branches: [claude/cheap-trip-tasks-6prz04]
    paths: [".github/workflows/probe-hotels.yml", "scrapers/google_hotels.py", "scrapers/google_flights.py"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Search a few stays with their dates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cat > /tmp/probe.py <<'EOF'
          import asyncio
          from datetime import date, timedelta
          from scrapers.base import build_client, random_headers
          from scrapers.google_hotels import _CONSENT_COOKIES, parse_cards, search_url

          check_in = date.today() + timedelta(days=40)
          check_out = check_in + timedelta(days=3)
          QUERIES = ["Naples", "Naples, IT", "Naples, Italy", "Valencia, ES", "Valencia, Spain",
                     "Córdoba, ES", "Córdoba, Spain", "Birmingham, GB", "Birmingham, United Kingdom",
                     "London, GB", "Paris, FR", "Krakow, PL"]

          async def main():
              async with build_client(timeout=30.0) as client:
                  client.cookies.update(_CONSENT_COOKIES)
                  for i, q in enumerate(QUERIES):
                      if i:
                          await asyncio.sleep(4)
                      resp = await client.get(search_url(q, check_in, check_out),
                                              headers=random_headers({"Accept-Language": "en-US,en;q=0.9"}))
                      cards = parse_cards(resp.text)
                      print(f"{q!r:30} HTTP {resp.status_code} {len(cards):2} cards:",
                            " | ".join(c.name[:32] for c in cards[:4]))

          asyncio.run(main())
          EOF
          python /tmp/probe.py
