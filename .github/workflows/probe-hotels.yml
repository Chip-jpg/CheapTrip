name: Probe Google Hotels (temporary)

on:
  push:
    branches: [claude/cheap-trip-tasks-6prz04]
    paths: [".github/workflows/probe-hotels.yml", "scrapers/google_hotels.py", "scrapers/google_flights.py"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Search a few stays with their dates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cat > /tmp/probe.py <<'EOF'
          import asyncio
          from datetime import date, timedelta
          from scrapers.google_hotels import GoogleHotelsScraper
          from storage.models import SearchTask

          today = date.today()
          def friday(weeks):
              d = today + timedelta(weeks=weeks)
              return d + timedelta(days=(4 - d.weekday()) % 7)
          CASES = [("KRK", friday(5), 3, 1), ("LIS", friday(6), 2, 1), ("BCN", friday(8), 4, 2), ("JFK", friday(7), 5, 1),
                   ("STN", friday(4), 2, 1), ("NAP", friday(10), 3, 1)]

          async def main():
              tasks = [SearchTask(destination=d, depart_from=c, depart_to=c, nights_min=n, nights_max=n, adults=a)
                       for d, c, n, a in CASES]
              outcome = await GoogleHotelsScraper().safe_scrape(tasks)
              print("\nstatus:", outcome.status.value, "count:", outcome.count, "error:", outcome.error,
                    "ms:", outcome.duration_ms)
              by_stay = {}
              for r in outcome.results:
                  by_stay.setdefault((r.location, r.check_in, r.check_out), []).append(r)
              for (city, cin, cout), rows in by_stay.items():
                  rows.sort(key=lambda r: r.price_per_night)
                  print(f"\n{city} {cin} -> {cout}: {len(rows)} hotels")
                  for r in rows[:4]:
                      print(f"  - {r.name[:45]:45} €{r.price_per_night:7.2f}/night x{r.nights} rating {r.rating} ({r.review_count})")
              print("\nbooking_url:", outcome.results[0].booking_url if outcome.results else None)

          asyncio.run(main())
          EOF
          python /tmp/probe.py
