name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  test-windows:
    # The Windows installer ships this code: the whole suite must pass on Windows too
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Benchmark on a month of history (reports only, in the job summary)
        continue-on-error: true
        run: python scripts/bench.py

  ui:
    # The desktop app's screens (ui/): type check, component tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ui-e2e:
    # Every screen and every control on the real engine and API, with a few days of seeded history,
    # in both themes and at every text size (ui/e2e, Playwright in Chromium); screenshots in the report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          pip install -r ../requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the screens
        run: npm run build

      - name: End to end
        run: npm run e2e

      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  ui-windows:
    # The screens in the app's real window (Edge WebView2), as a new install shows them: the setup wizard
    # it opens on, every sidebar item, a deal, the sidebar and theme switches (ui/e2e/window-smoke.mjs)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build the screens
        shell: pwsh
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix ui --no-audit --no-fund
          npm run build --prefix ui

      - name: The WebView2 runtime the window needs
        shell: pwsh
        run: |
          python -c "import sys; from desktop.windows import webview2_available; sys.exit(0 if webview2_available() else 1)"
          if ($LASTEXITCODE -ne 0) {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\webview2-setup.exe"
            Start-Process "$env:RUNNER_TEMP\webview2-setup.exe" -ArgumentList "/silent", "/install" -Wait
          }
          python -c "from desktop.windows import webview2_available; print('WebView2 runtime:', webview2_available())"
          $global:LASTEXITCODE = 0

      - name: A few days of price history
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\home" | Out-Null
          python scripts/bench.py --step seed --folder "$env:RUNNER_TEMP\home" --days 5

      - name: Open the app and drive its window
        shell: pwsh
        env:
          CHEAPTRIP_DEVTOOLS_PORT: "9222"
          SETUP_DONE: "false"  # a new install: the app opens on the setup wizard
        run: |
          $folder = "$env:RUNNER_TEMP\home"
          $env:CHEAPTRIP_HOME = $folder
          $env:DATABASE_URL = "sqlite+aiosqlite:///$($folder -replace '\\', '/')/bench.db"
          $env:CHEAPTRIP_PREFS_PATH = "$folder\prefs.yaml"
          $app = Start-Process python -ArgumentList "main.py", "app" -PassThru `
            -RedirectStandardOutput "$folder\app-out.txt" -RedirectStandardError "$folder\app-err.txt"
          node ui/e2e/window-smoke.mjs --port 9222 --home $folder --out dist/window-smoke
          $code = $LASTEXITCODE
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          exit $code

      - name: Keep the pictures and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: window-smoke
          path: |
            dist/window-smoke
            ${{ runner.temp }}/home/logs
            ${{ runner.temp }}/home/app-*.txt
          if-no-files-found: ignore

  windows-installer:
    # Builds the setup .exe, installs it silently and runs the installed app (packaging/build_windows.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build and smoke-test the installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Keep the installer and smoke-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/CheapTrip-Setup-*.exe
            dist/smoke-logs
          if-no-files-found: ignore
