name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  test-windows:
    # The Windows installer ships this code: the whole suite must pass on Windows too
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Benchmark on a month of history (reports only, in the job summary)
        continue-on-error: true
        run: python scripts/bench.py

  ui:
    # The desktop app's screens (ui/): type check, component tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  windows-installer:
    # Builds the setup .exe, installs it silently and runs the installed app (packaging/build_windows.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build and smoke-test the installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Keep the installer and smoke-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/CheapTrip-Setup-*.exe
            dist/smoke-logs
          if-no-files-found: ignore
