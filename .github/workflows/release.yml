name: Release

# Publishes a GitHub release with the Windows installer.
# Push a tag `v<version>` matching utils/version.py, or run this workflow by
# hand with that version (it then tags the commit it runs on).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.6.0 (must match utils/version.py)"
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq "push") { $env:TAG.TrimStart("v") } else { $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Not a version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build and smoke-test the installer
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Keep the smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs
          path: dist/smoke-logs
          if-no-files-found: ignore

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CheapTrip ${{ steps.version.outputs.version }}
          body_path: packaging/release-notes.md
          files: dist/CheapTrip-Setup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
