[project]
name = "cheaptrip"
version = "0.8.7"
description = "A travel-deal radar for Windows: learns what each route usually costs and alerts you when a fare is genuinely cheap"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samuele Carne" }]
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "ai_layer",
    "api",
    "config",
    "control",
    "desktop",
    "filters",
    "main",
    "normalizers",
    "notifier",
    "preferences",
    "scheduler",
    "scrapers",
    "storage",
    "tests",
    "trip_builder",
    "utils",
]
